# Scrapes the backend's actuator on its internal management port, plus the observability services themselves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cold-monitor-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
