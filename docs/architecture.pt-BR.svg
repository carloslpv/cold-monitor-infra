<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-label="Arquitetura do cold-monitor">
<title>Arquitetura do cold-monitor</title>
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
.b { font-size: 16px; font-weight: 700; }
.s { font-size: 13px; fill: #334155; }
.l { font-size: 13px; fill: #475569; }
.c { font-size: 14px; font-weight: 700; fill: #64748b; text-anchor: start; }
.a { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
