# Public demo: the regular stack plus Caddy for HTTPS, the simulator always on, a read-only login for visitors and
# Telegram alerts off. Use it on top of compose.yaml; see "Public demo" in README.md.
#
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
services:
  backend:
    image: cold-monitor-backend:demo
    environment:
      # alerts are only logged: the demo never messages anyone
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      VIEWER_USERNAME: ${VIEWER_USERNAME:-demo}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Set VIEWER_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: https://${DEMO_DOMAIN:?Set DEMO_DOMAIN in .env}

  dashboard:
    image: cold-monitor-dashboard:demo
    # only Caddy is reachable from outside
    ports: !reset []

  simulator:
    image: cold-monitor-simulator:demo
    # always on, without --profile simulator
    profiles: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "${DEMO_HTTP_PORT:-80}:80"
      - "${DEMO_HTTPS_PORT:-443}:443"
    environment:
      # Caddy gets and renews a Let's Encrypt certificate for this name on its own
      DEMO_SITE: ${DEMO_SITE:-${DEMO_DOMAIN}}
    volumes:
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

volumes:
  caddy-data:
