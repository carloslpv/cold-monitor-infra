name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose --profile simulator --profile observability config --quiet
          DEMO_DOMAIN=demo.example.com VIEWER_PASSWORD=ci-viewer-password \
            docker compose -f compose.yaml -f compose.demo.yaml config --quiet

  observability:
    name: Validate observability configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prometheus
        run: >
          docker run --rm -v "$PWD/observability/prometheus:/cfg:ro" --entrypoint promtool prom/prometheus:v3.15.0
          check config /cfg/prometheus.yml
      - name: Loki
        run: >
          docker run --rm -v "$PWD/observability/loki:/cfg:ro" grafana/loki:3.7.8
          -config.file=/cfg/loki.yaml -config.expand-env=true -verify-config
      - name: Alloy
        run: >
          docker run --rm -e COMPOSE_PROJECT=cold-monitor -v "$PWD/observability/alloy:/cfg:ro" grafana/alloy:v1.20.1
          validate /cfg/config.alloy
      - name: Grafana dashboard is valid JSON
        run: jq empty observability/grafana/dashboards/*.json
