name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose --profile simulator config --quiet
          DEMO_DOMAIN=demo.example.com VIEWER_PASSWORD=ci-viewer-password \
            docker compose -f compose.yaml -f compose.demo.yaml config --quiet
